[project]
name = "sea-marksman"
version = "0.1.0"
description = "EU MRV 선박 해상 효율 진단 서비스"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "joblib>=1.4",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "statsmodels>=0.14",
    "scipy>=1.13",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not acceptance'"
markers = [
    "acceptance: 5-2절 합격 기준 판정 (python tasks.py evaluate 후 실행)",
]
