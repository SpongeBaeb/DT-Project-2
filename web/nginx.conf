server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 진단 API: /api/diagnose → api:8000/diagnose (개발 서버의 vite 프록시와 같은 규칙)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # 선박별 JSON 은 매번 새로 받는다 (산출물을 새로 만들면 바로 반영)
    location /data/ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
